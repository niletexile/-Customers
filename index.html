/* ===== reconciliation v4: code first, centered, working search, plain-language notes ===== */
function recSearch(el){const p=el.selectionStart;fl.rec.q=el.value;rRec();const x=document.querySelector('#s-rec .tb input');x.focus();try{x.setSelectionRange(p,p)}catch(_){}}
function rRec(){const f=fl.rec=fl.rec||{q:'',st:''},q=(f.q||'').trim().toLowerCase(),tol=+ST('حد فرق المطابقة')||1000,all=C.rec,bad=all.filter(x=>x.diff!=null&&Math.abs(x.diff)>tol);
const have=new Set(all.map(x=>String(x.code))),extra=q?T().Customers.filter(s=>!have.has(String(s['كود العميل']))).map(s=>{const c=String(s['كود العميل']),bl=C.bal[c];return{code:c,name:s['اسم العميل'],book:bl==null?null:r2(bl),sc:C.sched[c]||0,diff:bl==null?null:r2(bl-(C.sched[c]||0))}}):[];const r=all.concat(extra).filter(x=>q?(x.name+' '+x.code).toLowerCase().includes(q):(f.st==='all'||x.diff==null||Math.abs(x.diff)>tol));
const nl=T().Cheques.filter(x=>x['الحالة']==='معلق'&&!x['كود العميل']),note=x=>x.diff==null?['b-gr','لا يوجد كشف حساب']:x.diff>tol?['b-bad','عليه رصيد بلا فواتير مفتوحة']:x.diff<-tol?['b-warn','متوقع أكثر من الرصيد']:['b-ok','مطابق'];
const ex=all.find(x=>x.diff!=null&&x.diff<-tol&&x.sc>0),ex2=all.find(x=>x.diff!=null&&x.diff>tol&&x.sc===0);
$('s-rec').innerHTML=ph('مطابقة الأرصدة','تقارن لكل عميل: كام عليه في كشف حسابه، مقابل الفواتير المفتوحة والشيكات المعلقة في الصفحة.')+
rib([['عملاء بفرق أكبر من '+f0(tol),bad.length,'من '+all.length+' عميل','mad'],['إجمالي الأرصدة المدينة',f0(C.book),'من كشوف الحسابات'],['المتوقع تحصيله',f0(C.tot),'فواتير مفتوحة + أوراق قبض معلقة']])+
`<div class="tb">${seg('rec',[['','الفروقات فقط'],['all','الكل']],f.st)}<input type="search" placeholder="ابحث بالاسم أو الكود في كل العملاء..." value="${esc(f.q)}" oninput="recSearch(this)"><span style="flex:1"></span><span class="hint" style="margin:0">${r.length} عميل${q?' (البحث يشمل كل العملاء)':''}</span></div>
<div class="tw"><table class="rc"><thead><tr><th>الكود</th><th>العميل</th><th>الرصيد</th><th>المتوقع تحصيله</th><th>الفرق</th><th>الدلالة</th><th class="no"></th></tr></thead><tbody>${r.slice(0,400).map(x=>{const n=note(x);return `<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td class="n">${x.book==null?'—':f2(x.book)}</td><td class="n">${f2(x.sc)}</td><td class="n" style="color:${x.diff==null?'#999':Math.abs(x.diff)>tol?'var(--mad)':'var(--ok)'}"><b>${x.diff==null?'—':f2(x.diff)}</b></td><td><span class="bg ${n[0]}">${n[1]}</span></td><td class="no"><button class="lk" onclick="openStmt('${esc(x.code)}')">كشف الحساب</button></td></tr>`}).join('')||'<tr><td colspan="7" class="hint" style="text-align:center;padding:24px">لا توجد نتائج</td></tr>'}</tbody></table></div>${nl.length?`<h3 style="margin-top:22px">شيكات غير مربوطة بعميل</h3>${nl.map(x=>`<div class="al info" onclick="openForm('Cheques','${x.ID}')">${esc(x['اسم الساحب'])} — ${f2(x['القيمة'])} — ${fd(x['تاريخ الاستحقاق'])}</div>`).join('')}`:''}`}

if(MIG&&gurl())setTimeout(()=>{gpost({action:'bulk',table:'Transactions',rows:db.tables.Transactions,replace:true});saveMaster()},1500);
/* ===== v5 additions ===== */
const THEMES=[['denim','#203a5c','نسيج'],['emerald','#14453d','زمرد'],['burgundy','#5d2133','عنّابي'],['graphite','#2d3240','جرافيت']];
function setTheme(t){localStorage.setItem('nile_theme',t);document.documentElement.dataset.theme=t;shellUp()}
function shellUp(){$('thm').innerHTML=THEMES.map(([k,c,n])=>`<button class="${document.documentElement.dataset.theme===k?'on':''}" style="background:${c}" title="${n}" onclick="setTheme('${k}')" aria-label="${n}"></button>`).join('');$('hu').textContent='👤 '+(user||'اكتب اسمك');$('lgx').classList.toggle('on',!!localStorage.getItem(KEY.logo))}
const _render=render;render=function(){_render();shellUp();emptyNote()};
function emptyNote(){let e=$('en');if(!e){e=document.createElement('div');e.id='en';document.querySelector('.top').after(e)}const empty=!db.tables.Customers.length&&!db.tables.Transactions.length;e.className=empty?'al on':'';e.style.display=empty?'':'none';e.textContent=empty?(gurl()?'⏳ لا توجد بيانات محلية — جاري التحميل من Google Sheets...':'📡 لا توجد بيانات. اربط الشيت من: الإعدادات ← خيارات متقدمة ← رابط Apps Script.'):''}
function applyLogo(){const l=localStorage.getItem(KEY.logo);$('logoSlot').innerHTML=(l?`<img src="${l}" alt="الشعار">`:'<span id="lg">＋ إضافة الشعار</span>')+'<input type="file" accept="image/*" hidden onchange="upLogo(event)">';if($('lgx'))$('lgx').classList.toggle('on',!!l)}
function rmLogo(){localStorage.removeItem(KEY.logo);applyLogo();toast('تم حذف الشعار')}
function askUser(){$('un').value=user||'';$('um').classList.add('on');setTimeout(()=>$('un').focus(),50)}
function saveUser(){const n=$('un').value.trim();if(!n)return toast('اكتب اسمك أولاً','e');user=n;localStorage.setItem(KEY.user,n);$('um').classList.remove('on');render();toast('أهلاً '+n)}
/* settings: supplier types as add/remove tags */
const typesUI=()=>`<div id="tg">${db.types.map((x,i)=>`<span class="tag">${esc(x)}<button onclick="delType(${i})" title="حذف" aria-label="حذف ${esc(x)}">✕</button></span>`).join('')||'<span class="hint">لا توجد أنواع</span>'}</div><div class="mf" style="margin-top:10px"><input id="nt" placeholder="نوع جديد" style="flex:1;padding:8px 12px;border:1px solid #c9cfde;border-radius:8px" onkeydown="if(event.key==='Enter')addType()"><button class="btn pri" onclick="addType()">+ إضافة</button></div>`;
function addType(){const v=$('nt').value.trim();if(!v)return;if(db.types.includes(v))return toast('النوع موجود بالفعل','e');db.types.push(v);save();saveMaster();render();toast('تمت إضافة النوع');$('nt')&&$('nt').focus()}
function delType(i){const t=db.types[i],n=T().Customers.filter(s=>s['النوع']===t).length;if(!confirm(n?`«${t}» مستخدم مع ${n} عميل — سيظل ظاهراً عندهم بعد الحذف من القائمة. متابعة؟`:`حذف «${t}»؟`))return;db.types.splice(i,1);save();saveMaster();render();toast('تم حذف النوع')}
/* calendar popup (works everywhere, never clipped by modals) */
let CAL=null;const CD=['س','ح','ن','ث','ر','خ','ج'];
function dtPick(b){const t=b.parentNode.querySelector('input[type=text]');if(t.readOnly)return;const s=dtParse(t.value)||TODAY;CAL={t,y:+s.slice(0,4),m:+s.slice(5,7)-1,sel:dtParse(t.value)};const r=t.getBoundingClientRect(),c=$('cal');c.style.top=Math.max(8,Math.min(r.bottom+4,innerHeight-340))+'px';c.style.left=Math.max(8,Math.min(r.left,innerWidth-292))+'px';calDraw();c.classList.add('on')}
function calDraw(){const{y,m,sel}=CAL,first=(new Date(y,m,1).getDay()+1)%7,n=new Date(y,m+1,0).getDate();let g=CD.map(d=>`<i>${d}</i>`).join('')+'<span></span>'.repeat(first);for(let d=1;d<=n;d++){const s=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');g+=`<button type="button" class="${s===TODAY?'t':''} ${s===sel?'s':''}" onclick="calSet('${s}')">${d}</button>`}
$('cal').innerHTML=`<div class="ch"><button type="button" onclick="calGo(12)" aria-label="السنة التالية">«</button><button type="button" onclick="calGo(1)" aria-label="الشهر التالي">‹</button><span>${MN[m]} ${y}</span><button type="button" onclick="calGo(-1)" aria-label="الشهر السابق">›</button><button type="button" onclick="calGo(-12)" aria-label="السنة السابقة">»</button></div><div class="cg">${g}</div><div class="cf"><button type="button" class="lk" onclick="calSet('${TODAY}')">اليوم</button><button type="button" class="lk dng" onclick="calSet('')">مسح</button></div>`}
function calGo(k){const d=new Date(CAL.y,CAL.m+k,1);CAL.y=d.getFullYear();CAL.m=d.getMonth();calDraw()}
function calSet(s){const t=CAL.t;t.value=s?fd(s):'';$('cal').classList.remove('on');t.dispatchEvent(new Event('change',{bubbles:true}));CAL=null}
document.addEventListener('mousedown',e=>{if(CAL&&!e.target.closest('#cal,.dt'))$('cal').classList.remove('on')});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('cal').classList.remove('on')});

function fixDb(){db.tables=db.tables||{};['Customers','Invoices','Cheques','Transactions'].forEach(k=>{db.tables[k]=(Array.isArray(db.tables[k])?db.tables[k]:[]).filter(Boolean)});db.settings=Object.assign({},SEED.settings,db.settings||{});if(!Array.isArray(db.types)||!db.types.length)db.types=[...new Set(db.tables.Customers.map(x=>x['النوع']).filter(Boolean))];if(!Array.isArray(db.statuses)||db.statuses.length<2)db.statuses=SEED.statuses.slice();db.statuses=db.statuses.map(s=>({name:s.name,days:+(s.days!==undefined?s.days:s['حتى']),color:s.color||s['اللون']||'رمادي'}));
['Invoices','Cheques'].forEach(k=>db.tables[k].forEach(r=>{r['تاريخ الاستحقاق']=r['تاريخ الاستحقاق']?String(r['تاريخ الاستحقاق']).slice(0,10):''}));db.tables.Transactions.forEach(r=>{r['التاريخ']=r['التاريخ']?String(r['التاريخ']).slice(0,10):''})}
function legacy(){if(!(db.tables&&db.tables.Ledger&&!db.tables.Transactions))return;try{localStorage.setItem('nilec_db_legacy',JSON.stringify(db))}catch(e){}const old=db;db={tables:{Customers:[],Invoices:[],Cheques:[],Transactions:[]},settings:Object.assign({},SEED.settings,old.settings||{}),types:SEED.types.slice(),statuses:(old.statuses||[]).length>1?old.statuses:SEED.statuses.slice()};localStorage.removeItem('nilec_ver');save()}
function BOOT(){try{legacy();fixDb();applyLogo();render();initSync()}catch(e){console.error(e);$('s-dash').innerHTML=`<div class="card"><h3>تعذر عرض البيانات</h3><p class="hint" style="direction:ltr;text-align:left">${esc(e.message)}</p><p class="hint">غالباً بيانات قديمة محفوظة في المتصفح. الزر التالي يمسحها ويعيد البيانات الأولية (لا يمس الشيت).</p><button class="btn dng" onclick="localStorage.removeItem(KEY.db);location.reload()">إعادة البيانات الأولية</button></div>`}}

/* ===== auto sync ===== */
let syncing=false,lastSyncAt=0;const hm=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function setSync(s,t){const b=$('sync');if(!b)return;b.className='chip s-'+s;b.innerHTML='<i class="dot"></i><span>'+(t||({busy:'⏳ جاري المزامنة...',ok:'آخر مزامنة '+hm(),err:'تعذرت المزامنة — اضغط للمحاولة',off:'غير مربوط بالشيت',warn:'تحتاج مزامنة يدوية'})[s])+'</span>'}
async function refVer(){clearTimeout(window._vt);window._vt=setTimeout(async()=>{try{const v=(await gget({action:'ver'})).ver;if(v&&!localStorage.nilec_dirty)localStorage.nilec_ver=v}catch(e){}},5000)}
async function syncNow(manual,show){if(syncing)return;if(!gurl()){setSync('off');if(manual)toast('اكتب رابط Apps Script في الإعدادات (أو داخل الملف)','e');return}
if(!manual&&localStorage.nilec_dirty){setSync('warn','تعديلات غير مرسلة للشيت');return}
syncing=true;if(manual||show)setSync('busy');try{let v='',fail=false;try{v=(await gget({action:'ver'})).ver||''}catch(e){fail=true}
if(fail&&!manual&&!show){setSync('err');return}
if(!manual&&v&&v===localStorage.nilec_ver&&db.tables.Customers.length){setSync('ok');lastSyncAt=Date.now();return}
setSync('busy');const r=await pull(!manual);setSync(r===true?'ok':r==='warn'?'warn':'err');if(r===true){lastSyncAt=Date.now();localStorage.removeItem('nilec_dirty');if(v)localStorage.nilec_ver=v}}finally{syncing=false}}
function initSync(){gurl()?syncNow(false,true):setSync('off');setInterval(()=>{if(document.visibilityState==='visible'&&getComputedStyle($('md')).display==='none')syncNow(false)},180000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastSyncAt>60000&&getComputedStyle($('md')).display==='none')syncNow(false)})}

BOOT();if(!user)setTimeout(askUser,200);
